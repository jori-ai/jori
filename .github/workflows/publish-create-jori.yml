name: publish create-jori

# Publishes packages/create-jori to npm (`npm create jori`). Run it by hand
# after bumping the package version, or it runs when site/install.sh changes
# on main with a version not yet on npm.
# Auth: npm trusted publishing (OIDC from this workflow, configured on the
# package's npm settings page: jori-ai/jori, publish-create-jori.yml), so no
# stored token. NPM_TOKEN, when set, is used instead (only for the very first
# publish of a new package, before trusted publishing can be configured).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [packages/create-jori/**, site/install.sh]

permissions:
  contents: read
  id-token: write   # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/create-jori
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing (11.5+)
        run: npm install -g npm@latest
      - name: Test
        run: node --test ../../tests/create-jori.test.mjs
      - name: Skip a version that is already published
        id: v
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "create-jori@$v" version >/dev/null 2>&1; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "create-jori@$v is already on npm"; fi
      - name: Publish
        if: steps.v.outputs.skip != '1'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
