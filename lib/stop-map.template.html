<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stop map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* Sized in vw for the same reason as place-map.template.html: it ships as a
     PNG into a ~260pt chat bubble, and vw is the only unit that survives
     Chrome's window sizing. Single light style — a PNG cannot follow theme. */
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#fff}
  body{font:1em/1.4 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#17160f;display:flex;flex-direction:column;height:100vh}
  #map{flex:1;min-height:0;background:#eeece6}
  footer{flex:none;display:flex;align-items:baseline;gap:2vw;
    padding:2.2vw 3vw 2.6vw;border-top:0.25vw solid #e3e1d9;background:#fff}
  footer b{font-size:4.2vw;font-weight:650;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  footer span{font-size:3.4vw;color:#6d6b61;flex:none;white-space:nowrap}
  footer i{display:inline-block;width:4vw;height:0.9vw;border-radius:1vw;
    vertical-align:middle;margin:0 0.8vw 0 1.6vw}
  .pin{width:6.5vw;height:6.5vw;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    background:#c2622c;border:0.7vw solid #fff;box-shadow:0 0.2vw 1vw rgba(0,0,0,.35)}
  .end{width:3vw;height:3vw;border-radius:50%;background:#fff;border:0.7vw solid #6d6b61}
  .leaflet-container{font:inherit;background:#eeece6}
  .leaflet-control-attribution{font-size:2.2vw;background:rgba(255,255,255,.72)}
</style>
</head>
<body>
<div id="map"></div>
<footer><b>__LABEL__</b><span><i style="background:#9a988f"></i>route<i style="background:#c2622c"></i>stop</span></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const STOP = __STOP__, BEFORE = __BEFORE__, DURING = __DURING__, AFTER = __AFTER__;
  const VW = document.documentElement.clientWidth / 100;
  const px = (n) => Math.round(n * VW);
  const map = L.map('map', {zoomControl:false, attributionControl:true});
  // Same keyless Esri canvas as place-map (CARTO started requiring a key).
  const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
  L.tileLayer(ESRI+'World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
    {maxNativeZoom:16,maxZoom:20,attribution:'&copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors'}).addTo(map);
  L.tileLayer(ESRI+'World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}',
    {maxNativeZoom:16,maxZoom:20,opacity:.9}).addTo(map);

  // The fixes are drawn as recorded — straight segments between fixes, not a
  // computed route. The point is "where was I, which way did I come and go",
  // and that is exactly what the raw trace says.
  const line = (pts, color, dash) => pts.length > 1 &&
    L.polyline(pts, {color, weight:px(1), opacity:.85, lineCap:'round',
      dashArray: dash ? `${px(0.6)} ${px(1.6)}` : null}).addTo(map);
  line(BEFORE, '#9a988f', false);
  line(AFTER, '#9a988f', true);
  line(DURING, '#c2622c', false);
  if (BEFORE.length) L.marker(BEFORE[0], {icon: L.divIcon({className:'',
    html:'<div class="end"></div>', iconSize:[px(3), px(3)], iconAnchor:[px(1.5), px(1.5)]})}).addTo(map);
  L.marker(STOP, {icon: L.divIcon({className:'', html:'<div class="pin"></div>',
    iconSize:[px(6.5), px(6.5)], iconAnchor:[px(3.25), px(6.5)]})}).addTo(map);

  // Frame the whole hour around the stop, but never wider than a
  // few blocks (zoom 16) and never tighter than a block (17). A long drive
  // in is cut off at the frame edge — the stop, not the drive, is the subject.
  const all = L.latLngBounds([STOP, ...DURING, ...BEFORE, ...AFTER]);
  const fit = map.getBoundsZoom(all, false, L.point(px(16), px(16)));
  if (fit >= 16) map.setView(all.getCenter(), Math.min(17, fit));
  else map.setView(STOP, 16);
</script>
</body>
</html>
